<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cenários e2e do popup — Proteu QA</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; }
      #placar { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
      .ok { color: #2e7d32; } .fail { color: #c62828; }
      ul { list-style: none; padding: 0; } li { padding: 3px 0; font-family: ui-monospace, monospace; font-size: 13px; }
      #app { position: fixed; left: -9999px; top: 0; }
    </style>
  </head>
  <body>
    <div id="placar">rodando…</div>
    <ul id="lista"></ul>
    <div id="app"></div>

    <script>
      // chrome mock instalado ANTES do popup.js rodar.
      const mem = { sync: {}, local: {} };
      const loja = (b) => ({
        async get(k) { return k in mem[b] ? { [k]: structuredClone(mem[b][k]) } : {}; },
        async set(o) { Object.assign(mem[b], structuredClone(o)); },
      });
      window.chrome = {
        storage: { sync: loja("sync"), local: loja("local") },
        tabs: { async query() { return [{ id: 1 }]; }, async sendMessage() { return { ok: false, erro: "sem-campo" }; } },
        scripting: { async executeScript() { return []; } },
        runtime: {},
      };
      window.__mem = mem;
    </script>

    <script type="module">
      import { validarCpf } from "/src/core/documents/cpf.js";
      import { validarCnpj } from "/src/core/documents/cnpj.js";
      import { validarSsn } from "/src/core/documents/us.js";
      import { validarCuit } from "/src/core/documents/ar.js";
      import { validarIdCardCN, validarUscc } from "/src/core/documents/cn.js";
      import { validarSin, validarBn } from "/src/core/documents/ca.js";
      import { validarNationalIdSA, validarVatSA } from "/src/core/documents/sa.js";
      import { validarCurpMX, validarRfcMX, validarNssMX } from "/src/core/documents/mx.js";
      import { validarAadhaar, validarGstin, validarPan } from "/src/core/documents/in.js";
      import { validarIbanDE, validarSteuerId } from "/src/core/documents/de.js";
      import { tiposDoPais } from "/src/core/gerador.js";
      const TIPOS = tiposDoPais("br");
      import { contarTudo } from "/src/core/text/contagem.js";

      const resultados = [];
      const assert = (nome, cond, detalhe = "") => resultados.push({ nome, ok: !!cond, detalhe: cond ? "" : String(detalhe) });
      const espera = (ms) => new Promise((r) => setTimeout(r, ms));
      const $ = (s) => document.querySelector(s);

      async function montarPopup() {
        const html = await (await fetch("/src/popup/popup.html")).text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        const css = await (await fetch("/src/popup/popup.css")).text();
        const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
        $("#app").replaceChildren(...doc.body.childNodes);
        await import("/src/popup/popup.js");
        document.dispatchEvent(new Event("DOMContentLoaded"));
        // espera o init assíncrono (seed preenchida ao fim de refletirConfigNaUI)
        for (let i = 0; i < 100 && !$("#campo-seed").value; i++) await espera(20);
      }

      const cfg = () => window.__mem.sync.config;
      const hist = () => window.__mem.local.historico || [];

      async function rodar() {
        await montarPopup();

        // P1 — seed persistida no primeiro carregamento
        assert("P1 seed gerada e persistida", /^[0-9a-f]{6}$/.test(cfg().seed), cfg().seed);

        // Lê um campo do perfil pela chave do tipo (independe do idioma).
        const doPerfil = (chave) => {
          const l = document.querySelector(`.pf-linha[data-chave="${chave}"] .pf-linha__val`);
          return l ? l.textContent : null;
        };
        const novaPessoa = async () => { $("#btn-nova-persona").click(); await espera(40); };

        // P2 — o perfil traz TODOS os tipos do país (menos os sequenciais)
        const semRaiz = Object.entries(TIPOS).filter(([, d]) => !d.raiz).map(([k]) => k);
        let todosGeram = true, falhou = "";
        for (const tipo of semRaiz) {
          if (!doPerfil(tipo)) { todosGeram = false; falhou = tipo; }
        }
        assert("P2 o perfil cobre todos os tipos do país", todosGeram, "faltou: " + falhou);
        assert("P2 o perfil tem e-mail derivado do nome", /@example\.com$/.test(doPerfil("cpf") ? document.querySelector('.pf-linha[data-slot="email"] .pf-linha__val').textContent : ""));

        // P3 — CPF e CNPJ do perfil são válidos
        assert("P3 CPF do perfil é válido", validarCpf(doPerfil("cpf")), doPerfil("cpf"));
        assert("P3 CNPJ do perfil é válido", validarCnpj(doPerfil("cnpj")), doPerfil("cnpj"));

        // P4 — o perfil inteiro é UMA geração (contador avança 1 por pessoa)
        const antes = cfg().contador;
        await novaPessoa();
        assert("P4 nova pessoa avança o contador em 1", cfg().contador === antes + 1, `${antes}→${cfg().contador}`);

        // P5 — trocar a seed reinicia o contador
        $("#campo-seed").value = "7f2a91";
        $("#campo-seed").dispatchEvent(new Event("change"));
        await espera(30);
        assert("P5 trocar a seed reinicia o contador", cfg().contador === 0 && cfg().seed === "7f2a91", JSON.stringify({ s: cfg().seed, c: cfg().contador }));

        // P6 — reprodutibilidade: mesma seed → mesmo perfil
        async function primeiroPerfilComSeed(seed) {
          $("#campo-seed").value = seed;
          $("#campo-seed").dispatchEvent(new Event("change"));
          await espera(40);
          return [doPerfil("nome"), doPerfil("cpf"), doPerfil("cnpj")];
        }
        const seqA = await primeiroPerfilComSeed("abcdef");
        const seqB = await primeiroPerfilComSeed("abcdef");
        assert("P6 mesma seed reproduz o mesmo perfil", JSON.stringify(seqA) === JSON.stringify(seqB), `${seqA} vs ${seqB}`);

        // P7 — config persiste: alternar "Com máscara" grava no storage
        const mascaraAntes = cfg().documentos.mascara;
        $("#opt-mascara").checked = !mascaraAntes;
        $("#opt-mascara").dispatchEvent(new Event("change"));
        await espera(20);
        assert("P7 alternar máscara persiste no storage", cfg().documentos.mascara === !mascaraAntes, JSON.stringify(cfg().documentos));

        // P8 — texto por tamanho exato + 4 contagens exibidas
        $('.aba[data-view="texto"]').click();
        $('#txt-tipo .seg[data-tipo="tamanho"]').click(); await espera(10);
        $("#tam-unidade").value = "bytes";
        $("#tam-alvo").value = "40";
        $("#btn-gerar-texto").click(); await espera(40);
        assert("P8 texto por tamanho: 40 bytes exatos", contarTudo($("#valor-texto").textContent).bytes === 40, $("#valor-texto").textContent);
        assert("P8 as 4 contagens são exibidas", document.querySelectorAll("#contagens .contagem").length === 4);

        // P9 — pseudolocalização aplicada na geração (marcadores ⟦…⟧)
        $('#txt-tipo .seg[data-tipo="palavras"]').click(); await espera(10);
        $("#txt-pseudo").checked = true; $("#txt-pseudo").dispatchEvent(new Event("change"));
        $("#btn-gerar-texto").click(); await espera(30);
        const ps = $("#valor-texto").textContent;
        assert("P9 pseudo envolve em marcadores ⟦…⟧", ps.startsWith("⟦") && ps.endsWith("⟧"), ps.slice(0, 20));
        $("#txt-pseudo").checked = false; $("#txt-pseudo").dispatchEvent(new Event("change"));

        // P10 — frases + idioma RTL marca direção
        $('#txt-tipo .seg[data-tipo="frases"]').click(); await espera(10);
        $("#idioma").value = "ar";
        $("#txt-qtd").value = "2";
        $("#btn-gerar-texto").click(); await espera(30);
        assert("P10 idioma árabe marca dir=rtl", $("#valor-texto").dir === "rtl", $("#valor-texto").dir);

        // P11 — aba Casos-limite: famílias, busca e copiar-todos
        $('.aba[data-view="invalidos"]').click(); await espera(15);
        const familias = [...document.querySelectorAll("#lim-familias .lim-familia")];
        assert("P11 renderiza as 5 famílias de casos-limite", familias.length === 5, familias.length);
        const totalCasos = document.querySelectorAll("#lim-familias .lim-caso").length;
        assert("P11 há vários casos no total", totalCasos > 20, totalCasos);
        // Busca filtra: "sql" deve mostrar só casos de SQLi.
        $("#lim-busca").value = "sql"; $("#lim-busca").dispatchEvent(new Event("input")); await espera(15);
        const visiveis = [...document.querySelectorAll("#lim-familias .lim-caso")].filter((c) => !c.hidden);
        assert("P11 busca 'sql' filtra para poucos casos", visiveis.length > 0 && visiveis.length < 8, visiveis.length);
        assert("P11 famílias sem match ficam escondidas", document.querySelector('.lim-familia[data-fam="numeros"]').hidden === true);
        // Busca sem resultado mostra aviso.
        $("#lim-busca").value = "zzzznada"; $("#lim-busca").dispatchEvent(new Event("input")); await espera(15);
        assert("P11 busca sem resultado exibe aviso", $("#lim-sem-resultado").hidden === false);
        // Limpa a busca.
        $("#lim-busca").value = ""; $("#lim-busca").dispatchEvent(new Event("input")); await espera(15);
        assert("P11 limpar busca some com o aviso", $("#lim-sem-resultado").hidden === true);
        // Unicode mostra contagens; a família Unicode é a que tem .lim-caso__cont.
        assert("P11 casos Unicode exibem as contagens inline", document.querySelector('.lim-familia[data-fam="unicode"] .lim-caso__cont') !== null);

        // P12 — navegação por abas troca o painel ativo
        $('.aba[data-view="perfil"]').click();
        const perfilAtivo = $('.painel[data-view="perfil"]').classList.contains("painel--ativo");
        const textoInativo = !$('.painel[data-view="texto"]').classList.contains("painel--ativo");
        assert("P12 abas alternam o painel ativo (um por vez)", perfilAtivo && textoInativo);
        assert("P12 são 3 abas (Perfil, Texto, Casos-limite)", document.querySelectorAll(".aba").length === 3);

        // P13 — modal de seleção de país (Brasil ativo, demais "em breve")
        $("#btn-pais").click(); await espera(20);
        assert("P13 modal de país abre", !$("#modal-pais").hidden);
        const paises = [...document.querySelectorAll(".pais-btn")];
        assert("P13 lista os 12 países", paises.length === 12, paises.length);
        const br = $('.pais-btn[data-pais="br"]');
        const cl = $('.pais-btn[data-pais="cl"]');
        assert("P13 Brasil ativo e habilitado", br.classList.contains("ativo") && !br.disabled);
        assert("P13 EUA, Canadá, Argentina, China, Arábia Saudita e México habilitados", !$('.pais-btn[data-pais="us"]').disabled && !$('.pais-btn[data-pais="ca"]').disabled && !$('.pais-btn[data-pais="ar"]').disabled && !$('.pais-btn[data-pais="cn"]').disabled && !$('.pais-btn[data-pais="sa"]').disabled && !$('.pais-btn[data-pais="mx"]').disabled && !$('.pais-btn[data-pais="in"]').disabled && !$('.pais-btn[data-pais="de"]').disabled);
        assert("P13 Chile ainda 'em breve' (desabilitado)", cl.disabled);
        assert("P13 país persistido é 'br' e interface em pt", cfg().pais === "br" && document.documentElement.lang === "pt-BR", cfg().pais);
        // Busca de país: acento-insensível e por código.
        const visiveisPais = () => [...document.querySelectorAll("#lista-paises li")].filter((li) => !li.hidden);
        $("#busca-pais").value = "mexico"; $("#busca-pais").dispatchEvent(new Event("input")); await espera(15);
        assert("P13 busca 'mexico' (sem acento) acha só o México", visiveisPais().length === 1 && visiveisPais()[0].querySelector(".pais-btn").dataset.pais === "mx");
        $("#busca-pais").value = "zzz"; $("#busca-pais").dispatchEvent(new Event("input")); await espera(15);
        assert("P13 busca sem resultado exibe aviso", $("#modal-sem-pais").hidden === false);
        $("#busca-pais").value = ""; $("#busca-pais").dispatchEvent(new Event("input")); await espera(15);
        assert("P13 limpar busca mostra os 11 de novo", visiveisPais().length === 11);
        $("#modal-fechar").click(); await espera(20);
        assert("P13 modal fecha", $("#modal-pais").hidden);

        // P14 — trocar de país troca idioma, botões e dados (EUA → Argentina)
        const trocarPais = async (codigo) => {
          $("#btn-pais").click(); await espera(20);
          $(`.pais-btn[data-pais="${codigo}"]`).click(); await espera(40);
        };
        // O perfil ja contem todos os documentos do pais; basta ler a linha.
        const gerarNoPais = async (tipo) => doPerfil(tipo);

        await trocarPais("us");
        assert("P14 EUA: interface em inglês", document.documentElement.lang === "en" && $(".aba[data-view=\"perfil\"]").textContent === "Profile");
        assert("P14 EUA: categorias Person/Company", $(".pf-secao__rot").textContent === "Person");
        assert("P14 EUA: opções de CNPJ escondidas (só BR tem)", $("#opcoes-cnpj").hidden);
        assert("P14 EUA: SSN gerado é válido", validarSsn(await gerarNoPais("ssn")), "");
        assert("P14 EUA: país persistido", cfg().pais === "us");

        await trocarPais("ca");
        assert("P14 Canadá: interface em inglês", document.documentElement.lang === "en" && $(".aba[data-view=\"perfil\"]").textContent === "Profile");
        assert("P14 Canadá: SIN gerado é válido (Luhn)", validarSin(await gerarNoPais("sin")), "");
        assert("P14 Canadá: BN gerado é válido (Luhn)", validarBn(await gerarNoPais("bn")), "");

        await trocarPais("ar");
        assert("P14 Argentina: interface em espanhol", document.documentElement.lang === "es" && $(".aba[data-view=\"perfil\"]").textContent === "Perfil");
        assert("P14 Argentina: CUIT gerado é válido", validarCuit(await gerarNoPais("cuit")), "");

        await trocarPais("mx");
        assert("P14 México: interface em espanhol", document.documentElement.lang === "es" && $(".aba[data-view=\"perfil\"]").textContent === "Perfil");
        assert("P14 México: CURP gerado é válido (DV mod 10)", validarCurpMX(await gerarNoPais("curp")), "");
        assert("P14 México: RFC gerado é válido (DV mod 11)", validarRfcMX(await gerarNoPais("rfc")), "");
        assert("P14 México: NSS gerado é válido (Luhn)", validarNssMX(await gerarNoPais("nss")), "");

        await trocarPais("cn");
        assert("P14 China: interface em chinês", document.documentElement.lang === "zh-CN" && $(".aba[data-view=\"perfil\"]").textContent === "资料");
        assert("P14 China: ID card gerado é válido (MOD 11-2)", validarIdCardCN(await gerarNoPais("idCard")), "");
        assert("P14 China: USCC gerado é válido (MOD 31-3)", validarUscc(await gerarNoPais("uscc")), "");

        await trocarPais("in");
        assert("P14 Índia: interface em híndi", document.documentElement.lang === "hi" && $(".aba[data-view=\"perfil\"]").textContent === "प्रोफ़ाइल");
        assert("P14 Índia: Aadhaar gerado é válido (Verhoeff)", validarAadhaar(await gerarNoPais("aadhaar")), "");
        assert("P14 Índia: GSTIN gerado é válido (base-36)", validarGstin(await gerarNoPais("gstin")), "");
        assert("P14 Índia: PAN gerado tem formato válido", validarPan(await gerarNoPais("pan")), "");

        await trocarPais("de");
        assert("P14 Alemanha: interface em alemão", document.documentElement.lang === "de" && $(".aba[data-view=\"perfil\"]").textContent === "Profil");
        assert("P14 Alemanha: IBAN gerado é válido (mod-97-10)", validarIbanDE(await gerarNoPais("iban")), "");
        assert("P14 Alemanha: Steuer-IdNr válido (MOD 11,10)", validarSteuerId(await gerarNoPais("steuerId")), "");

        await trocarPais("br"); // volta ao Brasil para não afetar outros checks
        assert("P14 volta ao Brasil (pt)", cfg().pais === "br" && document.documentElement.lang === "pt-BR");

        // P15 — idioma da interface FIXO desacoplado do país (QA pt testando China)
        $('.aba[data-view="config"]').click(); await espera(20);
        const selIdioma = $("#sel-idioma");
        assert("P15 seletor de idioma existe e começa em automático", selIdioma && selIdioma.value === "auto");
        // Fixa português.
        selIdioma.value = "pt"; selIdioma.dispatchEvent(new Event("change")); await espera(30);
        assert("P15 idiomaFixo persistido = pt", cfg().idiomaFixo === "pt");

        // Vai para a China: dados chineses, mas interface e rótulos em português.
        await trocarPais("cn");
        assert("P15 China + pt fixo: interface fica em português", document.documentElement.lang === "pt-BR" && $(".aba[data-view=\"perfil\"]").textContent === "Perfil");
        const rotIdCard = $(`.pf-linha[data-chave="idCard"] .pf-linha__rot`).textContent;
        assert("P15 rótulo do ID card em português", rotIdCard === "Nº de identidade", rotIdCard);
        const rotUscc = $(`.pf-linha[data-chave="uscc"] .pf-linha__rot`).textContent;
        assert("P15 rótulo do USCC em português", rotUscc === "Registro de empresa (USCC)", rotUscc);
        // Mas o DADO gerado continua sendo chinês (ID card válido MOD 11-2).
        assert("P15 dado do ID card continua chinês e válido", validarIdCardCN(await gerarNoPais("idCard")), "");

        // Volta para automático e Brasil (não afeta outros checks / re-runs).
        $('.aba[data-view="config"]').click(); await espera(20);
        $("#sel-idioma").value = "auto"; $("#sel-idioma").dispatchEvent(new Event("change")); await espera(30);
        assert("P15 volta a automático (idiomaFixo null)", cfg().idiomaFixo === null || cfg().idiomaFixo === undefined);
        await trocarPais("br");
        assert("P15 automático + Brasil volta ao pt", document.documentElement.lang === "pt-BR");

        // P16 — Arábia Saudita: interface árabe RTL + documentos válidos
        await trocarPais("sa");
        assert("P16 Arábia Saudita: interface em árabe", document.documentElement.lang === "ar" && $(".aba[data-view=\"perfil\"]").textContent === "ملف");
        assert("P16 Arábia Saudita: direção RTL aplicada no <html>", document.documentElement.dir === "rtl");
        assert("P16 Arábia Saudita: Documento nacional válido (Luhn)", validarNationalIdSA(await gerarNoPais("nationalId")), "");
        assert("P16 Arábia Saudita: VAT válido (15 díg)", validarVatSA(await gerarNoPais("vat")), "");

        // QA pt lendo dados sauditas: fixa pt, rótulos em pt, dados árabes, LTR de volta.
        $('.aba[data-view="config"]').click(); await espera(20);
        $("#sel-idioma").value = "pt"; $("#sel-idioma").dispatchEvent(new Event("change")); await espera(30);
        assert("P16 pt fixo em SA: interface pt e direção LTR", document.documentElement.lang === "pt-BR" && document.documentElement.dir === "ltr");
        assert("P16 rótulo do Documento nacional em pt", $(`.pf-linha[data-chave="nationalId"] .pf-linha__rot`).textContent === "Documento nacional (ID)");
        assert("P16 dado nacional continua saudita e válido", validarNationalIdSA(await gerarNoPais("nationalId")), "");

        // Restaura automático + Brasil.
        $('.aba[data-view="config"]').click(); await espera(20);
        $("#sel-idioma").value = "auto"; $("#sel-idioma").dispatchEvent(new Event("change")); await espera(30);
        await trocarPais("br");

        // placar
        const passou = resultados.filter((r) => r.ok).length;
        const total = resultados.length;
        const placar = $("#placar");
        placar.textContent = `${passou}/${total} cenários do popup passaram`;
        placar.className = passou === total ? "ok" : "fail";
        for (const r of resultados) {
          const li = document.createElement("li");
          li.className = r.ok ? "ok" : "fail";
          li.textContent = `${r.ok ? "✓" : "✗"} ${r.nome}${r.detalhe ? "  →  " + r.detalhe : ""}`;
          $("#lista").appendChild(li);
        }
        window.__resultados = { passou, total, resultados };
        window.__pronto = true;
      }

      rodar().catch((e) => {
        $("#placar").textContent = "ERRO: " + e.message;
        $("#placar").className = "fail";
        window.__erroRunner = String(e.stack || e);
        window.__pronto = true;
      });
    </script>
  </body>
</html>
