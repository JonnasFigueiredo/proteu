<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reproduzível</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div class="titulo">
        <span class="logo">R</span>
        <div>
          <h1>Reproduzível</h1>
          <p class="subtitulo">massa de dados de teste</p>
        </div>
      </div>
      <div class="acoes-cabecalho">
        <button id="btn-historico" class="icone" title="Histórico" aria-label="Histórico">🕘</button>
        <button id="btn-config" class="icone" title="Configurações" aria-label="Configurações">⚙️</button>
      </div>
    </header>

    <!-- Campo detectado (aparece quando há um campo ativo na página) -->
    <section id="secao-campo" class="secao campo-detectado" hidden>
      <h2>Campo detectado</h2>
      <p id="campo-descricao" class="campo-descricao"></p>
      <div id="chips-fronteira" class="chips"></div>
      <p id="feedback-campo" class="feedback" role="status" aria-live="polite"></p>
    </section>

    <!-- Configurações (toggle pela engrenagem) -->
    <section id="secao-config" class="secao" hidden>
      <h2>Configurações</h2>
      <label class="linha-config">
        <span>Modo de inserção</span>
        <select id="modo-insercao">
          <option value="valor">Injetar valor</option>
          <option value="colar">Simular colagem</option>
        </select>
      </label>
      <p class="ajuda">
        "Injetar valor" substitui o conteúdo (melhor para React/Vue). "Simular
        colagem" insere na posição do cursor.
      </p>
    </section>

    <!-- Documentos -->
    <section class="secao">
      <h2>Documentos</h2>

      <div class="opcoes">
        <label class="check">
          <input type="checkbox" id="opt-mascara" /> Com máscara
        </label>
        <label class="check">
          <input type="checkbox" id="opt-alfanumerico" /> CNPJ alfanumérico
        </label>
        <label class="check" id="wrap-ambiguas" hidden>
          <input type="checkbox" id="opt-ambiguas" /> Excluir ambíguas (I,O,U,Q,F)
        </label>
      </div>

      <!-- Botões montados dinamicamente a partir de TIPOS (core/gerador.js) -->
      <div id="botoes-doc" class="botoes-doc"></div>

      <div id="resultado" class="resultado" hidden>
        <output id="valor-gerado" class="valor"></output>
        <div class="acoes-resultado">
          <button id="btn-copiar" class="secundario">Copiar</button>
          <button id="btn-inserir" class="primario">Inserir no campo</button>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- Texto -->
    <section class="secao">
      <h2>Texto</h2>

      <div class="linha-texto">
        <select id="idioma" aria-label="Idioma"></select>
        <button id="btn-palavras" class="secundario">Gerar palavras</button>
      </div>

      <div class="linha-texto">
        <input
          id="tam-alvo"
          type="number"
          min="0"
          max="100000"
          value="100"
          aria-label="Tamanho alvo"
        />
        <select id="tam-unidade" aria-label="Unidade de contagem">
          <option value="grafemas">grafemas</option>
          <option value="codePoints">code points</option>
          <option value="codeUnits">code units</option>
          <option value="bytes">bytes UTF-8</option>
        </select>
        <button id="btn-tamanho" class="secundario">Por tamanho</button>
      </div>

      <div id="resultado-texto" class="resultado" hidden>
        <output id="valor-texto" class="valor valor-texto"></output>
        <div id="contagens" class="contagens"></div>
        <div class="acoes-resultado">
          <button id="btn-copiar-texto" class="secundario">Copiar</button>
          <button id="btn-pseudo" class="secundario" title="Pseudolocalizar">Pseudo</button>
          <button id="btn-inserir-texto" class="primario">Inserir</button>
        </div>
        <p id="feedback-texto" class="feedback" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- Histórico (toggle pelo relógio) -->
    <section id="secao-historico" class="secao" hidden>
      <div class="cabecalho-historico">
        <h2>Histórico da sessão</h2>
        <button id="btn-limpar-hist" class="link">Limpar</button>
      </div>
      <ul id="lista-historico" class="lista-historico"></ul>
      <p id="historico-vazio" class="ajuda">Nada gerado ainda.</p>
    </section>

    <!-- Rodapé: seed + selo 100% local -->
    <footer class="rodape">
      <div class="seed">
        <label for="campo-seed">seed:</label>
        <input
          id="campo-seed"
          type="text"
          spellcheck="false"
          maxlength="16"
          autocomplete="off"
          aria-label="Seed determinística (hexadecimal)"
        />
        <button id="btn-nova-seed" class="icone" title="Nova seed aleatória" aria-label="Nova seed">🎲</button>
      </div>
      <span class="selo" title="Nenhuma requisição de rede. Nenhuma coleta de dados.">🔒 100% local</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
